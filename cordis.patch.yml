# dsh-skill-router bundle patch.
#
# This is the layer `dsh plugin add` mounts: it inserts ONE row into the
# composed config tree. It is applied after the base and mode bundle layers
# (dsh-base, dsh-web-app, ...) and before the user's own `cordis.patch.yml`,
# so a user can still disable or reconfigure this row by id later:
#
#   - id: skill-router
#     disabled: true
- insert:
    - id: skill-router
      name: dsh-skill-router
      config:
        enabled: true
        embedding:
          model: Xenova/bge-m3
          dtype: q8
        # z-score gate (scale-invariant): keep skills whose score is >= 2.5
        # std-devs above the current query's mean AND >= the weak 0.05 floor.
        # Measured on the 24-skill corpus: false positives z 1.8-2.3, true
        # positives z 2.9-3.4 -> 2.5 splits cleanly.
        minScore: 0.05
        zThreshold: 2.5
        maxSkills: 4
